locale: "pt_br"

storage:
  type: "YAML" # YAML, SQLITE, MYSQL
  mysql:
    jdbc-url: "jdbc:mariadb://localhost:3306/minecraft"
    username: "root"
    password: ""
    pool-size: 6

performance:
  async-load: true
  cache-expire-minutes: 30
  placeholder-cache-millis: 1000
  animation-tick-interval: 10
  tab-update-debounce-millis: 750

permissions:
  grant-mode: "LUCKPERMS" # LUCKPERMS, COMMAND
  fallback-grant-command: "lp user {player} permission set {permission} true"
  fallback-remove-command: "lp user {player} permission unset {permission}"

gui:
  title: "<gradient:#48D1CC:#B654A2>Tags</gradient>"
  rows: 6
  sounds: true
  show-locked: true
  locked-material: BARRIER

messages:
  prefix: "<gradient:#48D1CC:#B654A2>UltimateTags</gradient> <dark_gray>»</dark_gray> "
